  name: Build OpenSees for Colab

  on:
    push:
      branches:
        - colab-build

    workflow_dispatch:

  jobs:
    build-ubuntu:
      name: Build OpenSees on Ubuntu 22.04
      runs-on: ubuntu-22.04
      timeout-minutes: 30

      steps:
        - name: Checkout OpenSees
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        # Python is needed only to install and run Conan.
        - name: Set up Python for Conan
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install Conan
          run: |
            python -m pip install conan
            conan profile detect --force

        - name: Configure OpenSees
          shell: bash
          run: |
            set -euo pipefail

            export CMAKE_POLICY_VERSION_MINIMUM=3.5

            conan install . --build=missing

            cmake \
              -S . \
              -B build/Release \
              -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release

        - name: Build OpenSees executable
          shell: bash
          run: |
            set -euo pipefail

            cmake --build build/Release \
              --target OpenSees \
              --parallel 8

        - name: Create portable Colab package
          shell: bash
          run: |
            set -euo pipefail

            TCL_INIT_FILE=$(
              sed -n \
                's/^TCL_INIT_FILE:[^=]*=//p' \
                build/Release/CMakeCache.txt
            )

            if [[ -z "${TCL_INIT_FILE}" || ! -f "${TCL_INIT_FILE}" ]]; then
              TCL_INIT_FILE=$(
                find "$HOME/.conan2" \
                  -type f \
                  -path "*/tcl8.6/init.tcl" \
                  -print \
                  -quit
              )
            fi

            if [[ -z "${TCL_INIT_FILE}" || ! -f "${TCL_INIT_FILE}" ]]; then
              echo "Matching Tcl library could not be found."
              exit 1
            fi

            echo "Using Tcl library: ${TCL_INIT_FILE}"

            mkdir -p package/bin
            mkdir -p package/lib/tcl8.6

            cp build/Release/OpenSees package/bin/OpenSees
            cp -a "$(dirname "${TCL_INIT_FILE}")/." package/lib/tcl8.6/

            chmod +x package/bin/OpenSees

            cat > package/OpenSees <<'EOF'
            #!/usr/bin/env sh
            ROOT=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
            export TCL_LIBRARY="$ROOT/lib/tcl8.6"
            exec "$ROOT/bin/OpenSees" "$@"
            EOF

            chmod +x package/OpenSees

            tar \
              -C package \
              -czf OpenSees-Colab-linux-x86_64.tar.gz \
              .

            sha256sum OpenSees-Colab-linux-x86_64.tar.gz \
              > OpenSees-Colab-linux-x86_64.tar.gz.sha256

        - name: Upload Colab package
          uses: actions/upload-artifact@v4
          with:
            name: OpenSees_Colab_Ubuntu_22_04
            path: |
              OpenSees-Colab-linux-x86_64.tar.gz
              OpenSees-Colab-linux-x86_64.tar.gz.sha256
            if-no-files-found: error
            retention-days: 30
